# Define los dos contenedores del proyecto y como se conectan.
services:

  # Contenedor 2: base de datos PostgreSQL
  database:
    image: postgres:16.4
    container_name: database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data   # guarda los datos aunque se borre el contenedor
    networks:
      - red-proyecto
    healthcheck:                                   # comprueba que PostgreSQL ya acepta conexiones
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Contenedor 1: API en ASP.NET Core
  api-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-app
    restart: unless-stopped
    ports:
      - "${API_PORT}:8080"                         # puerto del computador : puerto del contenedor
    environment:
      # Host=database es el NOMBRE DEL SERVICIO (no localhost, no una IP)
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy                 # la API espera a que la base este lista
    networks:
      - red-proyecto

networks:
  red-proyecto:
    driver: bridge

volumes:
  postgres_data:
