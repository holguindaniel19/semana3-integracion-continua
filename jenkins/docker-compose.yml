# Jenkins en un contenedor, separado de la aplicacion (Entrega 1).
# Se inicia desde esta carpeta:  docker compose up -d --build
services:
  jenkins:
    build: .
    image: jenkins-con-docker:1.0
    container_name: jenkins
    restart: unless-stopped
    user: root                        # permite usar el socket de Docker sin configurar grupos
    ports:
      - "8081:8080"                   # interfaz web (8080 ya lo usa la API del proyecto)
      - "50000:50000"                 # puerto para agentes de Jenkins
    volumes:
      - jenkins_home:/var/jenkins_home                # guarda configuracion, plugins y credenciales
      - /var/run/docker.sock:/var/run/docker.sock     # Jenkins usa el Docker del equipo

volumes:
  jenkins_home:
